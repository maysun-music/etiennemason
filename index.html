<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Etienne Mason</title>

    <meta name="description"
        content="Etienne Mason — Live Audio Technician, Corporate AV, Instrument Designer and Composer based in Brooklyn, New York.">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="grain-overlay"></div>

    <main class="page">

        <section class="identity">

            <header>
                <h1>ETIENNE MASON</h1>
                <p class="location">Brooklyn, New York, United States</p>
            </header>

            <p class="description">
                Live Audio Engineering &amp;<br>
                Creative Audio
            </p>

            <nav class="links">

                <a href="https://www.linkedin.com/in/etiennemason" target="_blank" rel="noopener noreferrer">CV</a>

                <a href="mailto:etienne.mason@gmail.com">Contact</a>

                <a class="maysun" href="https://maysun.zip" target="_blank" rel="noopener noreferrer">MAYSUN</a>

            </nav>

        </section>

        <details class="availability">

            <summary>Availability Request</summary>

            <div class="availability-content">

                <form id="availability-form" action="https://formspree.io/f/mljgpwnj" method="POST">

                    <input type="text" id="inquiry-name" name="name" placeholder="Name / Organization *"
                        aria-label="Name / Organization" autocomplete="name" required>

                    <input type="email" id="inquiry-email" name="email" placeholder="Email *" aria-label="Email"
                        autocomplete="email" required>

                    <input type="text" id="inquiry-dates" name="dates" placeholder="Date(s) *" aria-label="Date(s)"
                        required>

                    <input type="text" id="inquiry-hours" name="hours" placeholder="Hours / Schedule"
                        aria-label="Hours / Schedule">

                    <input type="text" id="inquiry-location" name="location" placeholder="Location *"
                        aria-label="Location" required>

                    <select id="inquiry-type" name="work_type" aria-label="Type of Work" required>
                        <option value="" disabled selected>Type of Work *</option>
                        <option value="A1">A1</option>
                        <option value="A2">A2</option>
                        <option value="AV">A/V</option>
                        <option value="Live Recording">Live Recording</option>
                        <option value="Creative Audio">Creative Audio</option>
                        <option value="Other">Other</option>
                    </select>

                    <textarea id="inquiry-description" name="description" placeholder="Project Description *"
                        aria-label="Project Description" rows="2" required></textarea>

                    <input type="text" id="inquiry-budget" name="budget" placeholder="Rate / Budget"
                        aria-label="Rate / Budget">

                    <input type="text" id="inquiry-referral" name="referral" placeholder="How did you hear about me?"
                        aria-label="How did you hear about me?">

                    <button type="submit" class="submit-inquiry">
                        [send]
                    </button>

                    <p class="availability-note">
                        Submitting a request does not confirm availability or a booking.
                    </p>

                </form>

                <p id="form-success" class="form-feedback" role="status" hidden>
                    Request received. Thank you.
                </p>

                <p id="form-error" class="form-feedback" role="alert" hidden>
                    Something went wrong. Please try again or use the Contact link.
                </p>

            </div>

        </details>

    </main>

    <script>
        const form = document.getElementById("availability-form");
        const successMessage = document.getElementById("form-success");
        const errorMessage = document.getElementById("form-error");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const submitButton = form.querySelector('button[type="submit"]');

            successMessage.hidden = true;
            errorMessage.hidden = true;

            submitButton.disabled = true;
            submitButton.textContent = "Submitting...";

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form),
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error("Submission failed");
                }

                form.reset();
                form.hidden = true;
                successMessage.hidden = false;

            } catch (error) {
                errorMessage.hidden = false;

            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Submit Request";
            }
        });
    </script>

</body>

</html>
